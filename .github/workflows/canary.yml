name: Canary

# Rot detection for the years when nobody is committing (docs/adr/004).
#
# CI pins everything so releases are reproducible; that also means CI stays
# green while the ecosystem moves underneath the package. This workflow runs
# monthly against what a *user* would get today — the newest compatible
# runtime dependencies, the newest tree-sitter grammars, and the next Python
# pre-release — and opens (or updates) a single tracking issue on failure.
# Nothing here publishes or pushes.

on:
  schedule:
    - cron: "17 6 1 * *"   # 06:17 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-dependencies:
    name: Latest compatible deps (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with the newest versions the ranges allow
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --upgrade-strategy eager -e ".[deep]" pytest ruff
          pip list --format=columns | grep -iE 'click|rich|tree-sitter|pytest' || true
      - name: Test
        run: pytest -p no:cacheprovider -q

  grammar-ceiling:
    # Deliberately ignore the [deep] upper bounds: the day a new tree-sitter
    # runtime or grammar breaks the ABI we want to learn it here, not from
    # a user report.
    name: Newest tree-sitter grammars, bounds ignored
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install newest grammars
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
          pip install --upgrade tree-sitter tree-sitter-go tree-sitter-c tree-sitter-cpp tree-sitter-rust
          pip list --format=columns | grep -i tree-sitter
      - name: Deep tests only
        run: pytest -p no:cacheprovider -q tests/test_deep.py tests/test_rust.py tests/test_c_family.py tests/test_go_signals.py

  python-prerelease:
    name: Next Python pre-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15-dev'
          allow-prereleases: true
      - name: Install pure-Python core
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Test (deep tests skip cleanly without grammars)
        run: pytest -p no:cacheprovider -q

  report:
    name: Open or update the tracking issue
    if: failure()
    needs: [latest-dependencies, grammar-ceiling, python-prerelease]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or refresh the canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Canary failed: ecosystem drift detected"
          body="The monthly canary failed. A newer dependency, grammar or Python pre-release breaks the package as users would install it today. Run: $RUN_URL"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label "canary"
          fi
