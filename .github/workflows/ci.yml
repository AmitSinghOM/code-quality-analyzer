name: CI

on:
  push:
    branches: [main]
    paths:
      - "cqa_analyzer/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "Action-Plan guide.md"
      - "pyproject.toml"
      - "requirements.txt"
      - "MANIFEST.in"
      - ".pre-commit-hooks.yaml"
      - "LICENSE"
      - "SECURITY.md"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "cqa_analyzer/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "Action-Plan guide.md"
      - "pyproject.toml"
      - "requirements.txt"
      - "MANIFEST.in"
      - ".pre-commit-hooks.yaml"
      - "LICENSE"
      - "SECURITY.md"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  platform-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test filesystem, cache, privacy, and report behavior
        run: >-
          pytest tests/test_scanner.py tests/test_package_intelligence.py
          tests/test_baseline.py tests/test_cache.py tests/test_changed_lines.py
          tests/test_cli.py tests/test_config.py tests/test_offline.py
          tests/test_sarif.py

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build tooling
        run: python -m pip install build==1.3.0 setuptools==80.9.0

      - name: Build source and wheel distributions
        run: python -m build --no-isolation

      - name: Verify source distribution hook metadata
        shell: python
        run: |
          import glob
          import re
          import tarfile

          source = open("cqa_analyzer/__init__.py", encoding="utf-8").read()
          schema_version = re.search(
              r'REPORT_SCHEMA_VERSION = "([^"]+)"', source
          ).group(1)

          archives = glob.glob("dist/*.tar.gz")
          assert len(archives) == 1, archives
          with tarfile.open(archives[0]) as stream:
              names = stream.getnames()
          assert any(
              name.endswith("/.pre-commit-hooks.yaml")
              for name in names
          )
          schema_name = f"/docs/report-schema-{schema_version}.json"
          assert any(
              name.endswith(schema_name)
              for name in names
          ), schema_name

      - name: Verify wheel and source distribution installations
        shell: bash
        run: |
          set -euo pipefail
          wheel_path=$(printf '%s\n' dist/*.whl)
          sdist_path=$(printf '%s\n' dist/*.tar.gz)
          EXPECTED_VERSION=$(python -c 'import cqa_analyzer; print(cqa_analyzer.__version__)')
          export EXPECTED_VERSION
          python -m venv "$RUNNER_TEMP/wheel-venv"
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install "$wheel_path"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install "$sdist_path"

          pushd "$RUNNER_TEMP" >/dev/null
          "$RUNNER_TEMP/wheel-venv/bin/python" -c '
          import os
          import sys
          from importlib.metadata import version
          from pathlib import Path
          import cqa_analyzer

          expected = os.environ["EXPECTED_VERSION"]
          assert version("cqa-analyzer") == expected, version("cqa-analyzer")
          assert cqa_analyzer.__version__ == expected, cqa_analyzer.__version__
          assert Path(cqa_analyzer.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          '
          "$RUNNER_TEMP/wheel-venv/bin/code-quality-analyzer" \
            "$GITHUB_WORKSPACE" --strict --output-format json --offline --anonymize
          "$RUNNER_TEMP/sdist-venv/bin/python" -c '
          import os
          import sys
          from importlib.metadata import version
          from pathlib import Path
          import cqa_analyzer

          expected = os.environ["EXPECTED_VERSION"]
          assert version("cqa-analyzer") == expected, version("cqa-analyzer")
          assert cqa_analyzer.__version__ == expected, cqa_analyzer.__version__
          assert Path(cqa_analyzer.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          '
          "$RUNNER_TEMP/sdist-venv/bin/code-quality-analyzer" \
            "$GITHUB_WORKSPACE" --strict --output-format json --offline --anonymize
          popd >/dev/null

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and audit tooling
        run: python -m pip install -e ".[dev]"

      - name: Audit declared runtime dependencies
        run: pip-audit --requirement requirements.txt --strict

      - name: Audit resolved local environment
        # --skip-editable: the project itself is installed editable and is
        # not (yet) auditable against PyPI; its declared dependencies are
        # audited strictly by the previous step. No --strict here because
        # strict mode turns the deliberate editable skip into an error;
        # found vulnerabilities still fail the step.
        run: pip-audit --local --skip-editable

  self-check:
    # Dogfood: the analyzer rates its own source and gates on the result.
    # --strict fails the job if any file could not be read or parsed, so a
    # regression in the discovery layer cannot pass silently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # The threshold is a ratchet: raise it as the codebase improves,
      # never lower it to hide a regression.
      - name: Rate this repository
        run: code-quality-analyzer . --fail-under 4.5 --strict -c
