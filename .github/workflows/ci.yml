name: CI

on:
  push:
    branches: [main]
    paths:
      - "analyzer/**"
      - "tests/**"
      - "docs/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "MANIFEST.in"
      - ".pre-commit-hooks.yaml"
      - "LICENSE"
      - "SECURITY.md"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "analyzer/**"
      - "tests/**"
      - "docs/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "MANIFEST.in"
      - ".pre-commit-hooks.yaml"
      - "LICENSE"
      - "SECURITY.md"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what this is developed against; 3.10 is the floor declared
        # in pyproject.toml.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  platform-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test filesystem and privacy behavior
        run: >-
          pytest tests/test_scanner.py tests/test_package_intelligence.py
          tests/test_baseline.py tests/test_cli.py

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build tooling
        run: python -m pip install build==1.3.0 setuptools==80.9.0

      - name: Build source and wheel distributions
        run: python -m build --no-isolation

      - name: Verify source distribution hook metadata
        shell: python
        run: |
          import glob
          import tarfile

          archives = glob.glob("dist/*.tar.gz")
          assert len(archives) == 1, archives
          with tarfile.open(archives[0]) as stream:
              names = stream.getnames()
          assert any(
              name.endswith("/.pre-commit-hooks.yaml")
              for name in names
          )

      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Smoke test installed command
        run: >-
          code-quality-analyzer . --strict --output-format json
          --offline --anonymize

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.7.3

      - name: Audit dependencies
        run: pip-audit --requirement requirements.txt --strict

  self-check:
    # Dogfood: the analyzer rates its own source and gates on the result.
    # --strict fails the job if any file could not be read or parsed, so a
    # regression in the discovery layer cannot pass silently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Current self-rating is 5.1. The threshold sits just below it as a
      # ratchet — raise it as the codebase improves, never lower it.
      - name: Rate this repository
        run: code-quality-analyzer . --fail-under 4.5 --strict -c
