name: Publish to PyPI

# Trusted Publishing (OIDC): no API token exists anywhere. PyPI must be
# configured once with a "trusted publisher" for this repository:
#   PyPI project: cqa-analyzer
#   Owner: AmitSinghOM   Repository: code-quality-analyzer
#   Workflow: publish.yml   Environment: pypi
# Configure at https://pypi.org/manage/account/publishing/ (use the
# "pending publisher" form before the first upload).

on:
  release:
    types: [published]
  # Release events read the workflow from the tag's commit, so releases
  # tagged before this file existed cannot trigger it. Dispatch runs the
  # main-branch workflow against any existing release tag instead.
  # Dispatch defaults to a dry run: the build job (tag/version guard,
  # `python -m build`, `twine check --strict`) always runs; the publish
  # job (PyPI upload + release assets) runs only for release events or
  # when dry_run is explicitly set to false.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. v2.29.0)"
        required: true
        type: string
      dry_run:
        description: "Build and twine-check only; skip the PyPI upload and release-asset upload"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Verify the tag matches the package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          package_version=$(python -c 'import cqa_analyzer; print(cqa_analyzer.__version__)')
          if [ "$RELEASE_TAG" != "v$package_version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi

      - name: Install release tooling
        # build + twine and their transitive closure, every line hash-pinned
        # (regenerate with the command in requirements-release.in). The
        # build backend `python -m build` fetches into its isolated env is
        # still resolved from pyproject's [build-system] range, unhashed.
        run: python -m pip install --require-hashes -r requirements-release.txt

      - name: Build source and wheel distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Store distributions for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    # Skipped on a dry-run dispatch; the real upload needs a release event
    # or an explicit dry_run=false.
    if: github.event_name == 'release' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cqa-analyzer/
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

      - name: Attach distributions to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/* --clobber \
            --repo "$GITHUB_REPOSITORY"
