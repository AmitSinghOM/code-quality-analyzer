name: Publish to PyPI

# Trusted Publishing (OIDC): no API token exists anywhere. PyPI must be
# configured once with a "trusted publisher" for this repository:
#   PyPI project: cqa-analyzer
#   Owner: AmitSinghOM   Repository: code-quality-analyzer
#   Workflow: publish.yml   Environment: pypi
# Configure at https://pypi.org/manage/account/publishing/ (use the
# "pending publisher" form before the first upload).

on:
  release:
    types: [published]
  # Release events read the workflow from the tag's commit, so releases
  # tagged before this file existed cannot trigger it. Dispatch runs the
  # main-branch workflow against any existing release tag instead.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. v2.29.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify the tag matches the package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          package_version=$(python -c 'import cqa_analyzer; print(cqa_analyzer.__version__)')
          if [ "$RELEASE_TAG" != "v$package_version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi

      - name: Build source and wheel distributions
        run: |
          python -m pip install build==1.3.0
          python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install twine==7.0.0
          python -m twine check --strict dist/*

      - name: Store distributions for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cqa-analyzer/
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Attach distributions to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/* --clobber \
            --repo "$GITHUB_REPOSITORY"
