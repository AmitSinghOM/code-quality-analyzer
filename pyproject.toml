[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-quality-analyzer"
dynamic = ["version"]
description = "Privacy-first static code health analysis for Python packages"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # click <8.3.3 carries PYSEC-2026-2132; keep this at or above the fix.
    "click==8.3.3",
    "rich==14.3.4",
    "tomli==2.2.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "build==1.3.0",
    "pytest==8.3.4",
    "pip-audit==2.7.3",
    "ruff==0.8.4",
]

[project.scripts]
code-quality-analyzer = "analyzer.__main__:main"

[tool.setuptools]
packages = ["analyzer"]

[tool.setuptools.dynamic]
version = { attr = "analyzer.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP"]
# S101: asserts are the point in tests.
per-file-ignores = { "tests/*" = ["S101"] }
