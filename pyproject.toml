[build-system]
requires = ["setuptools>=80.9.0,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "cqa-analyzer"
dynamic = ["version"]
description = "Privacy-first static code health analysis for Python packages"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Amit Singh"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # click <8.3.3 carries PYSEC-2026-2132; keep this at or above the fix.
    "click==8.5.0",
    "rich==14.3.4",
]

[project.urls]
Homepage = "https://github.com/AmitSinghOM/code-quality-analyzer"
Documentation = "https://github.com/AmitSinghOM/code-quality-analyzer#readme"
Issues = "https://github.com/AmitSinghOM/code-quality-analyzer/issues"
Repository = "https://github.com/AmitSinghOM/code-quality-analyzer"

[project.optional-dependencies]
dev = [
    "build==1.3.0",
    # pytest <9.0.3 carries PYSEC-2026-1845; keep this at or above the fix.
    "pytest==9.0.3",
    "pip-audit==2.7.3",
    "ruff==0.8.4",
]

[project.scripts]
code-quality-analyzer = "cqa_analyzer.__main__:main"

[tool.setuptools.packages.find]
include = ["cqa_analyzer*"]

[tool.setuptools.dynamic]
version = { attr = "cqa_analyzer.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP"]
# S101: asserts are the point in tests.
per-file-ignores = { "tests/*" = ["S101"] }
