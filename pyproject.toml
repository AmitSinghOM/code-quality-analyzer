[build-system]
requires = ["setuptools>=80.9.0,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "cqa-analyzer"
dynamic = ["version"]
description = "Privacy-first static code health analysis for Python packages"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Amit Singh"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
# 3.0: no runtime dependencies (docs/adr/004, ROADMAP item 12 Phase 2). The
# CLI is argparse, text rendering is cqa_analyzer/text_render.py, and the
# optional [deep] extra is the only third-party code the package can load.
# A pure-stdlib core has nothing left to rot.
dependencies = []

[project.urls]
Homepage = "https://github.com/AmitSinghOM/code-quality-analyzer"
Documentation = "https://github.com/AmitSinghOM/code-quality-analyzer#readme"
Issues = "https://github.com/AmitSinghOM/code-quality-analyzer/issues"
Repository = "https://github.com/AmitSinghOM/code-quality-analyzer"

[project.optional-dependencies]
# Optional tree-sitter depth for Go and C/C++ (duplication + cyclomatic
# complexity). The default install stays pure Python; these are compiled
# wheels (abi3) for every supported interpreter. Ranges track the grammar
# ABI the tree-sitter runtime accepts.
deep = [
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-go>=0.23,<0.26",
    "tree-sitter-c>=0.23,<0.25",
    "tree-sitter-cpp>=0.23,<0.24",
    "tree-sitter-rust>=0.23,<0.25",
]
dev = [
    "build==1.6.1",
    # pytest <9.0.3 carries PYSEC-2026-1845; keep this at or above the fix.
    "pytest==9.1.1",
    "pip-audit==2.10.1",
    "ruff==0.8.4",
    # SARIF output is validated against the vendored OASIS 2.1.0 schema.
    "jsonschema==4.26.0",
]

[project.scripts]
code-quality-analyzer = "cqa_analyzer.__main__:main"
# MCP server for coding agents (stdio transport, stdlib only).
cqa-mcp = "cqa_analyzer.mcp_server:main"

[tool.setuptools.packages.find]
include = ["cqa_analyzer*"]

[tool.setuptools.dynamic]
version = { attr = "cqa_analyzer.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP"]
# S101: asserts are the point in tests.
per-file-ignores = { "tests/*" = ["S101"] }
